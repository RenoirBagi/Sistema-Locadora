<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Funcionários - YOLOOK</title>

  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/auth.js"></script>
</head>

<body>
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">YOLOOK</a>

      <nav class="main-nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="index.html">Aluguéis</a>
        <a href="filmes.html">Filmes</a>
        <a href="clientes.html">Clientes</a>
        <a href="funcionarios.html">Funcionários</a>
      </nav>

      <div class="search-container">
        <input type="search" placeholder="Buscar filme">
      </div>
    </div>
  </header>

  <main class="main-content">
    <h1>Gestão de Funcionários</h1>

    <button onclick="window.location.href='novo_funcionario.html'">
      Novo Funcionário
    </button>

    <table>
      <thead>
        <tr>
          <th>CPF</th>
          <th>Nome</th>
          <th>Cargo</th>
          <th>E-mail</th>
          <th>Status</th>
          <th>Contato</th>
          <th>Endereço</th>
          <th>Ações</th>
        </tr>
      </thead>

      <tbody id="funcionarios-tbody"></tbody>
    </table>
  </main>

  <!-- Modal Editar Funcionário -->
  <div id="modal-editar-funcionario" class="modal-overlay">
    <div class="modal-box modal-box--largo">
      <h2>Editar Funcionário</h2>

      <form id="form-editar-funcionario">
        <div class="modal-grid">
          <div class="modal-group">
            <label for="edit-cpf">CPF</label>
            <input type="text" id="edit-cpf" disabled>
          </div>

          <div class="modal-group">
            <label for="edit-nome">Nome</label>
            <input type="text" id="edit-nome" required>
          </div>

          <div class="modal-group">
            <label for="edit-cargo">Cargo</label>
            <input type="text" id="edit-cargo" required>
          </div>

          <div class="modal-group">
            <label for="edit-email">E-mail Corporativo</label>
            <input type="email" id="edit-email" required>
          </div>

          <div class="modal-group">
            <label for="edit-senha">Nova Senha (deixe em branco para manter)</label>
            <input type="password" id="edit-senha" placeholder="Digite se quiser alterar">
          </div>

          <div class="modal-group">
            <label for="edit-status">Status</label>
            <select id="edit-status" required>
              <option value="ativo">Ativo</option>
              <option value="inativo">Inativo</option>
            </select>
          </div>

          <div class="modal-group">
            <label for="edit-contato">Contato</label>
            <input type="text" id="edit-contato" required>
          </div>

          <div class="modal-group">
            <label for="edit-endereco">Endereço</label>
            <input type="text" id="edit-endereco" required>
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-cancelar" onclick="fecharModalFuncionario()">
            Cancelar
          </button>

          <button type="submit">
            Salvar alterações
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Excluir Funcionário -->
  <div id="modal-excluir-funcionario" class="modal-overlay">
    <div class="modal-box modal-confirmacao">
      <h2>Excluir Funcionário</h2>

      <p id="texto-confirmar-exclusao-funcionario">
        Tem certeza que deseja excluir este funcionário?
      </p>

      <div class="modal-actions">
        <button type="button" class="btn-cancelar" onclick="fecharModalExcluirFuncionario()">
          Cancelar
        </button>

        <button type="button" class="btn-excluir-confirmar" onclick="confirmarExclusaoFuncionario()">
          Excluir
        </button>
      </div>
    </div>
  </div>

  <script src="js/dialog.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/config.js"></script>
  <script src="js/funcionarios.js"></script>
  <script src="js/search.js"></script>
</body>

</html>
